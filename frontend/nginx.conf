# Serves the built SPA and reverse-proxies /api/* to the backend container
# on the internal Docker network, so the browser only ever talks to this one
# origin — no CORS configuration needed, and the API container is never
# exposed with a browser-facing origin of its own beyond what the portal
# operator already publishes for it directly.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) — any non-file, non-/api path falls
    # back to index.html so a deep link like /applications/{id} works on a
    # hard refresh instead of 404ing at the nginx layer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }
}
